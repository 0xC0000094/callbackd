<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Callbackd</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        width: 320px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        font-size: 13px;
        color: #18181b;
        background: white;
      }
      header {
        padding: 14px 16px 10px;
        border-bottom: 1px solid #e4e4e7;
      }
      header h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      header p {
        margin: 2px 0 0;
        font-size: 11px;
        color: #71717a;
      }
      main {
        padding: 14px 16px;
      }
      .field {
        font-size: 11px;
        color: #71717a;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .value {
        font-size: 12px;
        color: #18181b;
        word-break: break-all;
        margin-bottom: 12px;
        line-height: 1.4;
      }
      .preview {
        background: #f4f4f5;
        border: 1px solid #e4e4e7;
        border-radius: 6px;
        padding: 8px 10px;
        font-size: 11px;
        color: #52525b;
        max-height: 96px;
        overflow-y: auto;
        margin-bottom: 14px;
        white-space: pre-wrap;
      }
      .status {
        font-size: 11px;
        color: #71717a;
        margin-bottom: 10px;
      }
      .status.error {
        color: #b91c1c;
      }
      button {
        display: block;
        width: 100%;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        border: 1px solid;
      }
      button.primary {
        background: #18181b;
        color: white;
        border-color: #18181b;
        margin-bottom: 8px;
      }
      button.primary:hover {
        background: #27272a;
      }
      button.secondary {
        background: white;
        color: #18181b;
        border-color: #e4e4e7;
      }
      button.secondary:hover {
        border-color: #18181b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      footer {
        padding: 10px 16px;
        border-top: 1px solid #f4f4f5;
        font-size: 10px;
        color: #a1a1aa;
        text-align: center;
      }
      footer a {
        color: #71717a;
        text-decoration: none;
      }
      footer a:hover {
        color: #18181b;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Callbackd</h1>
      <p>One-click legitimacy check</p>
    </header>
    <main>
      <div class="field">Page</div>
      <div class="value" id="page-url">Loading…</div>

      <div class="field">Detected posting text</div>
      <div class="preview" id="preview">Reading the page…</div>

      <div class="status" id="status"></div>

      <button class="primary" id="analyze" disabled>
        Open in Callbackd
      </button>
      <button class="secondary" id="recheck">Re-read this page</button>
    </main>
    <footer>
      <a href="https://callbackd.vercel.app" target="_blank">
        callbackd.vercel.app
      </a>
    </footer>
    <script src="popup.js"></script>
  </body>
</html>
